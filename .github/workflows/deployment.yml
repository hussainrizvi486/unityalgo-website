name: UnityAlgo Deployment

on:
  push:
    branches:
      - production

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Matches standard Next.js 14/15 requirements
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Code Quality (Optional)
        run: |
          npm run lint --if-present
          npm test --if-present

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Next.js Build Test
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}


  
  deploy:
    name: Deploying on Production
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute Remote Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: APP_DIR
          script: |
            set -e

            cd "${{ secrets.APP_DIR }}"

            echo "==> Pulling latest code"
            git fetch origin production
            git reset --hard origin/production

            echo "==> Installing dependencies"
            npm ci

            echo "==> Generating Prisma Client"
            npx prisma generate

            echo "==> Running migrations"
            npx prisma migrate deploy

            echo "==> Building Next.js"
            npm run build

            echo "==> Restarting application"
            pm2 reload nextjs-app --update-env

            echo "==> Saving PM2 process list"
            pm2 save

            echo "==> Deployment complete"

            echo "${{ secrets.SERVER_PASSWORD }}" | sudo systemctl reload nginx
            echo "==> Nginx Restarted"
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
