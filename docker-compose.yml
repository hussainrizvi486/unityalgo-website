services:
  redis:
    image: redis:7-alpine
    container_name: unityalgo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - unityalgo_redis_data:/data

  postgres:
    image: postgres:16
    container_name: unityalgo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5440:5432"
    volumes:
      - unityalgo_cloud_data:/var/lib/postgresql/data

volumes:
  unityalgo_redis_data:
  unityalgo_cloud_data:
