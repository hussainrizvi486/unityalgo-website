services:
  postgres:
    image: postgres:16
    container_name: unityalgo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5440:5432"
    volumes:
      - unityalgo_cloud_data:/var/lib/postgresql/data

volumes:
  unityalgo_cloud_data:
