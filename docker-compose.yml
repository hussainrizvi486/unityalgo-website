services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: unityalgo
    ports:
      - "5432:5432"
    volumes:
      - unityalgo_cloud_data:/var/lib/postgresql/data

volumes:
  unityalgo_cloud_data:
